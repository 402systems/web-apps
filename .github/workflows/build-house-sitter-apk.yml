name: Build House Sitter APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/misc/house-sitter/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - uses: actions/setup-node@v4
        with:
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Ensure EAS project is linked
        working-directory: apps/mobile/misc/house-sitter
        run: |
          if ! grep -q '"projectId"' app.json 2>/dev/null; then
            eas init --non-interactive --force
          fi

      - name: Build APK via EAS
        working-directory: apps/mobile/misc/house-sitter
        run: |
          BUILD_JSON=$(eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json)
          BUILD_URL=$(echo "$BUILD_JSON" | jq -r 'if type == "array" then .[0] else . end | .artifacts.buildUrl')
          curl -fsSL "$BUILD_URL" -o /tmp/house-sitter.apk

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete house-sitter-latest --yes 2>/dev/null || true
          git push origin :refs/tags/house-sitter-latest 2>/dev/null || true
          gh release create house-sitter-latest /tmp/house-sitter.apk \
            --title "House Sitter – Latest Build" \
            --notes "**Install:** download the APK, open it on your Android device (you may need Settings → Install unknown apps enabled for your browser).

**First run:** open the Leaving tab, stand inside the apartment, and tap *Set the house to here*. Grant location \"Allow all the time\" so leave alerts fire with the app closed." \
            --prerelease
